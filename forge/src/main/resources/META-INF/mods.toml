modLoader = "javafml"
loaderVersion = "*"
issueTrackerURL = "https://github.com/ShirozNguyen/MemoryLeakFix-Continued/issues"
license = "LGPL-3.0-or-later"

[[mods]]
modId = "memoryleakfix"
version = "${version}"
displayName = "Memory Leak Fix: Continued"
authors = "TheRealShiroz, FX - PR0CESS"
description = '''
Fanmade continuation of Memory Leak Fix for modern Minecraft versions. Fixes multiple memory leaks and lingering references both client-side and server-side.
'''
logoFile = "icon.png"

[[dependencies.memoryleakfix]]
modId = "forge"
mandatory = true
versionRange = "${forgeVersion}"
ordering = "NONE"
side = "BOTH"

[[dependencies.memoryleakfix]]
modId = "minecraft"
mandatory = true
versionRange = "${mcVersion}"
ordering = "NONE"
side = "BOTH"

[custom.mc-publish]
modrinth="cFBi8ffk"