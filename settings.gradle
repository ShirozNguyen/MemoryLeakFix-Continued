pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.minecraftforge.net/" }
        gradlePluginPortal()
    }
}

include("common")

def platformsStr = startParameter.projectProperties["enabled_platforms"]
if (platformsStr == null || platformsStr.trim().isEmpty()) {
    platformsStr = "fabric,forge"
}
def platforms = platformsStr.split(",")*.trim()

if (platforms.contains("fabric")) {
    include("fabric")
}
if (platforms.contains("forge") || platforms.contains("neoforge")) {
    include("forge")
}

rootProject.name = "memoryleakfix"
